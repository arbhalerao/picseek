[project]
name = "picseek-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "picseek-proto",
    "grpcio>=1.75",
    "pillow>=11.0",
]

[project.scripts]
picseek-eval = "picseek_eval.run:main"

[tool.uv.sources]
picseek-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picseek_eval"]
