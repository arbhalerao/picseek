[tool.uv.workspace]
members = ["gen/python", "services/runtime", "services/ocr", "services/embed", "eval"]

[dependency-groups]
dev = ["ruff>=0.13"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"eval/src/picseek_eval/corpus.py" = ["E501"]
