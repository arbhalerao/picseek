name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf generate && git diff --exit-code
      - if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -tags sqlite_fts5 ./...
      - run: go vet -tags sqlite_fts5 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags sqlite_fts5

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  go-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -tags sqlite_fts5 ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-packages --no-dev --no-emit-workspace --no-hashes -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --no-deps --disable-pip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          PICSEEK_FOLDER: .
