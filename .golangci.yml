version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - bodyclose
    - copyloopvar
  exclusions:
    paths:
      - gen

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/arbhalerao/picseek
  exclusions:
    paths:
      - gen
