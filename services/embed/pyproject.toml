[project]
name = "picseek-embed"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "picseek-proto",
    "picseek-runtime",
    "grpcio>=1.75",
    "fastembed>=0.9",
    "onnxruntime>=1.31",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
picseek-embed = "picseek_embed.server:main"

[tool.uv.sources]
picseek-proto = { workspace = true }
picseek-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picseek_embed"]
