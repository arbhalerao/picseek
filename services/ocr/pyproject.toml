[project]
name = "picseek-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "picseek-proto",
    "picseek-runtime",
    "grpcio>=1.75",
    "rapidocr>=3.10",
    "onnxruntime>=1.31",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.13"]

[project.scripts]
picseek-ocr = "picseek_ocr.server:main"

[tool.uv.sources]
picseek-proto = { workspace = true }
picseek-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picseek_ocr"]
